html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ivory);font-family:Roboto,'Noto Sans',system-ui,sans-serif;line-height:1.55;overflow-x:hidden}

nav{display:flex;gap:18px;font-size:14px}

h1{font-size:48px;line-height:1.08;margin:0 0 16px;letter-spacing:-.5px}

.lead{font-size:19px;color:#C9CDD3;margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#181A20;font-weight:700;text-decoration:none;padding:13px 22px;border-radius:12px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid var(--line)}
.soon{font-size:12.5px;color:var(--muted);margin-top:12px}
.phones{display:flex;gap:14px;justify-content:center}

section{padding:56px 0}
section.alt{background:var(--bg2)}
h2{font-size:32px;margin:0 0 8px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 30px;font-size:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:10px}

.card ul{margin:0;padding-left:18px;color:#C9CDD3;font-size:14.5px}
.card li{margin-bottom:5px}
.shots{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.shots img{height:440px;border-radius:16px;scroll-snap-align:start;flex:none;border:1px solid var(--line)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.steps .card{position:relative;padding-top:52px}
.steps .card:before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:20px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#181A20;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps p{margin:0;color:#C9CDD3;font-size:15px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plans .card.full{border-color:var(--gold)}
.plans>*,.price>*{min-width:0}
.price{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.price div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12.5px;color:var(--muted)}
.price b{display:block;color:var(--ivory);font-size:15px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:500;font-size:16px}
details p{margin:10px 0 0;color:#C9CDD3}
.rg{border:1px solid var(--gold);border-radius:16px;padding:22px;background:rgba(240,185,11,.06)}
.rg ul{margin:8px 0 0;padding-left:18px;color:#C9CDD3}
footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer a{color:var(--muted)}
.contact{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:820px){
 nav{display:none}

 section{padding:40px 0}

.badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:7px 14px;border-radius:999px;background:rgba(240,185,11,.14);border:1px solid var(--gold);color:var(--gold);font:600 14px Roboto,sans-serif;text-decoration:none}

.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}

Sic Bo",["Odds and payout of every bet.","Layout suggestions and roll history.","Payouts adjustable to your table."]]],"faqs":[["Does Lucky 8 guarantee I’ll win?","No. It is an educational and statistics tool. No method changes the house edge."],["Can I play or bet money in the app?","No. Lucky 8 does not handle real money: no betting, it doesn’t take or pay bets and it isn’t connected to any gaming venue. Poker chips have no value."],["Can I play poker with my friends?","Yes, on the same phone: in Poker choose “With friends”, type your names and pass the phone around. The screen covers itself each turn."],["Does it work offline?","Yes. Everything runs on your phone. Only ads and purchases need internet."],["What data does it keep?","Your records, games and settings are stored only on your phone. There are no user accounts. More in the privacy policy."],["How do I cancel my subscription?","In Google Play: Profile → Payments & subscriptions → Subscriptions → Lucky 8 → Cancel."],["Which languages?","Spanish, English, Portuguese, French, German, Italian, Russian, Chinese, Japanese, Korean, Hindi and Indonesian."]]},"pt":{"name":"Português","nPoker":"Pôquer","nGames":"Jogos","nHow":"Como usar","nPlans":"Versões","nFaq":"Perguntas","nContact":"Contato","badge":"♠ Novo: campeonato de até 100 jogadores →","h1":"Pôquer, roleta e mais, <span>no seu celular</span>","lead":"Lucky 8 é uma ferramenta educativa: treine pôquer com um professor, jogue campeonatos de até 100 jogadores ou com seus amigos e calcule pagamentos e probabilidades nos jogos de mesa mais populares.","play":"Em breve no Google Play","see":"Ver o que faz","soon":"Sem dinheiro real · Só para maiores de 18 anos · 12 idiomas","pkT":"♠ Pôquer: cinco formas de jogar","pkS":"Tudo funciona sem internet e sem dinheiro real. As fichas não têm nenhum valor.","modes":[["🎯","Jogo na mesa","Para quando você joga numa mesa de verdade: marque suas cartas e as da mesa e veja sua chance de ganhar, seus outs e se vale a pena pagar."],["🎓","Modo treino","Rivais com personalidade (Nit, TAG, Calling station, LAG e Reg) e um professor que avalia cada decisão e explica por quê. Com dica e glossário à mão."],["🏆","Campeonato","De 1 a 100 rivais: várias mesas, blinds que sobem, mesa final e pódio. No fim, o professor mostra onde você errou."],["🃏","Mesa livre","Blinds fixos e apostas livres, como numa mesa real. Jogue quantas mãos quiser e veja sua análise no fim."],["👥","Com amigos","De 2 a 4 no mesmo celular, passando de mão em mão. A tela se cobre a cada vez para ninguém ver suas cartas."]],"gT":"Seis jogos, um só app","gS":"Cada jogo com suas próprias ferramentas.","sT":"Veja como é","sS":"Tema escuro e claro, feito para o celular.","hT":"Como usar","hS":"Não precisa de conta nem de internet.","h1s":"Escolha o jogo no início. Cada um tem um guia curto.","h2s":"Anote o que sai na mesa ou jogue contra os rivais do app.","h3s":"Veja as estatísticas, as sugestões, quanto devem pagar ou a análise do professor.","pT":"Grátis e versão completa","pS":"Comece grátis e desbloqueie mais quando quiser.","fT":"Grátis","fL":["Os seis jogos com as funções básicas.","Um campeonato por dia e jogo com 2 amigos no mesmo celular.","Em cada jogo, até 3 vídeos por dia para usar todas as funções por algumas jogadas.","Um anúncio pequeno na parte de baixo."],"cT":"Versão completa","cL":["Todas as funções dos seis jogos.","Campeonatos de até 100 jogadores e jogo com até 4 amigos.","Sem anúncios.","Personalização completa: roletas, mesas, cartas, dados e cores."],"p1":"24 horas","p2":"semana","p3":"mês","p4":"6 meses","p5":"ano","pN":"Preços de referência em dólares; o Google Play mostra na moeda de cada país. As assinaturas se renovam sozinhas até você cancelar no Google Play.","qT":"Perguntas frequentes","rT":"Jogo responsável","rL":["Lucky 8 é educativo: não garante ganhos. Nesses jogos a casa sempre tem vantagem.","Defina antes quanto pode gastar e não tente recuperar o que perdeu.","Só para maiores de 18 anos." m Pôquer escolha «Com amigos», digitem os nomes e passem o celular. A tela se cobre a cada vez."],["Funciona sem internet?","Sim. Tudo funciona no celular. Só os anúncios e as compras precisam de internet."],["Que dados ele guarda?","Suas anotações, partidas e ajustes ficam só no seu celular. Não há contas de usuário. Mais detalhes na política de privacidade."],["Como cancelo a assinatura?","No Google Play: Perfil → Pagamentos e assinaturas → Assinaturas → Lucky 8 → Cancelar."],["Em quais idiomas está?","Espanhol, inglês, português, francês, alemão, italiano, russo, chinês, japonês, coreano, hindi e indonésio."]]},"fr":{"name":"Français","nPoker":"Poker","nGames":"Jeux","nHow":"Mode d’emploi","nPlans":"Versions","nFaq":"Questions","nContact":"Contact","badge":"♠ Nouveau : tournois jusqu’à 100 joueurs →","h1":"Poker, roulette et plus, <span>sur ton téléphone</span>","lead":"Lucky 8 est un outil éducatif : entraîne-toi au poker avec un coach, joue des tournois jusqu’à 100 joueurs ou entre amis, et calcule paiements et probabilités dans les jeux de table les plus populaires.","play":"Bientôt sur Google Play","see":"Voir ce qu’il fait","soon":"Sans argent réel · Réservé aux 18 ans et plus · 12 langues","pkT":"♠ Poker : cinq façons de jouer","pkS":"Tout fonctionne hors ligne et sans argent réel. Les jetons n’ont aucune valeur.","modes":[["🎯","Jeu à table","Quand tu joues à une vraie table : indique tes cartes et le tableau, et vois tes chances de gagner, tes outs et si suivre vaut le coup."],["🎓","Mode entraînement","Des adversaires avec du caractère (Nit, TAG, Calling station, LAG et Reg) et un coach qui note chaque décision et t’explique pourquoi. Indice et glossaire à portée de main."],["🏆","Tournois","De 1 à 100 adversaires : plusieurs tables, blindes qui montent, table finale et podium. À la fin, le coach te montre tes erreurs."],["🃏","Table libre","Blindes fixes et mises libres, comme à une vraie table. Joue autant de mains que tu veux et vois ton analyse à la fin."],["👥","Entre amis","De 2 à 4 sur le même téléphone, en se le passant. L’écran se masque à chaque tour pour que personne ne voie tes cartes."]],"gT":"Six jeux, une seule appli","gS":"Chaque jeu avec ses propres outils.","sT":"Aperçu","sS":"Thème sombre et clair, pensé pour le téléphone.","hT":"Mode d’emploi","hS":"Ni compte ni internet nécessaires.","h1s":"Choisis le jeu sur l’accueil. Chacun a un petit guide.","h2s":"Note ce qui sort à la table ou joue contre les adversaires de l’appli.","h3s":"Vois les statistiques, les suggestions, ce qu’on te doit ou l’analyse du coach.","pT":"Gratuit et version complète","pS":"Commence gratuitement et débloque plus quand tu veux.","fT":"Gratuit","fL":["Les six jeux avec leurs fonctions de base.","Un tournoi par jour et le jeu à 2 amis sur le même téléphone.","Dans chaque jeu, jusqu’à 3 vidéos par jour pour tout utiliser pendant quelques coups.","Une petite annonce en bas."],"cT":"Version complète","cL":["Toutes les fonctions des six jeux.","Tournois jusqu’à 100 joueurs et jeu jusqu’à 4 amis.","Sans publicité.","Personnalisation complète : roulettes, tapis, cartes, dés et couleurs."],"p1":"24 heures","p2":"semaine","p3":"mois","p4":"6 mois","p5":"an","pN":"Prix indicatifs en dollars ; Google Play les affiche dans la devise de chaque pays. Les abonnements se renouvellent jusqu’à leur annulation dans Google Play.","qT":"Questions fréquentes","rT":"Jeu responsable","rL":["Lucky 8 est éducatif : il ne garantit aucun gain. Dans ces jeux, la maison a toujours l’avantage.","Fixe à l’avance combien tu peux dépenser et ne cherche pas à te refaire.","Réservé aux 18 ans et plus.","Si le jeu n’est plus un plaisir, parles-en à une personne de confiance ou à un professionnel de santé. Tu peux aussi trouver de l’aide auprès des <a href=\"https://www.gamblersanonymous.org\" target=\"_blank\" rel=\"noopener\">Joueurs Anonymes</a>."],"kT":"Contact","kS":"Suggestions, questions ou problèmes : écris-nous.","lab":"Découvrez aussi","foot":"Outil éducatif · Sans argent réel · 18+","priv":"Politique de confidentialité","terms":"Conditions d’utilisation","games":[["♠","Poker",["Texas Hold’em et Omaha de 4 à 8 cartes.","Chances de gagner contre 1 à 7 adversaires, outs et intérêt de suivre.","Entraînement avec coach, tournois jusqu’à 100 joueurs, table libre et jeu entre amis."]],["◎","Roulette",["Européenne et américaine ; note sur la roue ou le tapis.","Suggestions avec voisins et statistiques complètes.","Calculateur de paiements : place tes jetons, indique le numéro et vois ce qu’on te doit."]],["♦","Baccara",["Bead plate, Big Road et routes dérivées.","Suggestions avec les méthodes classiques de motifs et avec Lucky 8, notre méthode, avec les réussites de chacune.","Relevé libre et simulateur de plan."]],["♣","Blackjack",["Le bon coup selon les règles de ta table et le nombre de jeux.","Tes chances de gagner pour chaque coup.","Mode entraînement : décide sans voir les chiffres, puis vois si tu avais raison."]],["⚄","Craps",["Table complète avec toutes les mises.","Bilan de chaque lancer avec le détail des paiements.","La qualité de chaque mise selon l’avantage de la maison."]],["⚂","Sic Bo",["Probabilité et paiement de chaque mise.","Suggestions du tapis et historique des lancers.","Paiements ajustables à ta table."]]],"faqs":[["Lucky 8 garantit-il que je vais gagner ?","Non. C’est un outil éducatif et statistique. Aucune méthode ne change l’avantage de la maison."],["Peut-on jouer ou miser de l’argent dans l’appli ?","Non. Lucky 8 ne gère pas d’argent réel : pas de mises, il ne reçoit ni ne paie de mises et n’est relié à aucune salle de jeu. Les jetons du poker n’ont aucune valeur."],["Puis-je jouer au poker avec mes amis ?","Oui, sur le même téléphone : dans Poker choisis « Entre amis », écrivez vos noms et passez-vous le téléphone. L’écran se masque à chaque tour."],["Ça marche hors ligne ?","Oui. Tout fonctionne sur le téléphone. Seules les publicités et les achats ont besoin d’internet."],["Quelles données garde-t-il ?","Tes relevés, parties et réglages restent uniquement sur ton téléphone. Il n’y a pas de compte utilisateur. Plus de détails dans la politique de confidentialité."],["Comment annuler l’abonnement ?","Dans Google Play : Profil → Paiements et abonnements → Abonnements → Lucky 8 → Annuler."],["Dans quelles langues ?","Espagnol, anglais, portugais, français, allemand, italien, russe, chinois, japonais, coréen, hindi et indonésien."]]},"de":{"name":"Deutsch","nPoker":"Poker","nGames":"Spiele","nHow":"So geht’s","nPlans":"Versionen","nFaq":"Fragen","nContact":"Kontakt","badge":"♠ Neu: Turniere mit bis zu 100 Spielern →","h1":"Poker, Roulette und mehr, <span>auf deinem Handy</span>","lead":"Lucky 8 ist ein Lernwerkzeug: trainiere Poker mit einem Coach, spiele Turniere mit bis zu 100 Spielern oder mit Freunden und berechne Auszahlungen und Wahrscheinlichkeiten in den beliebtesten Tischspielen.","play":"Bald bei Google Play","see":"Was es kann","soon":"Kein echtes Geld · Nur ab 18 · 12 Sprachen","pkT":"♠ Poker: fünf Arten zu spielen","pkS":"Alles funktioniert offline und ohne echtes Geld. Die Chips haben keinen Wert.","modes":[["🎯","Am Tisch","Für den echten Tisch: markiere deine Karten und das Board und sieh deine Gewinnchance, deine Outs und ob sich das Mitgehen lohnt."],["🎓","Trainingsmodus","Gegner mit Persönlichkeit (Nit, TAG, Calling station, LAG und Reg) und ein Coach, der jede Entscheidung bewertet und erklärt. Tipp und Glossar immer zur Hand."],["🏆","Turniere","1 bis 100 Gegner: mehrere Tische, steigende Blinds, Finaltisch und Podium. Am Ende zeigt dir der Coach deine Fehler."],["🃏","Freier Tisch","Feste Blinds und freie Einsätze wie am echten Tisch. Spiel so viele Hände du willst und sieh am Ende deine Analyse."],["👥","Mit Freunden","2 bis 4 Spieler auf einem Handy, das weitergereicht wird. Bei jedem Zug wird der Bildschirm verdeckt, niemand sieht deine Karten."]],"gT":"Sechs Spiele, eine App","gS":"Jedes Spiel mit eigenen Werkzeugen.","sT":"So sieht rniere mit bis zu 100 Spielern, freier Tisch und Spiel mit Freunden."]],["◎","Roulette",["Europäisch und amerikanisch; am Kessel oder Tableau notieren.","Vorschläge mit Nachbarn und vollständige Statistik.","Auszahlungsrechner: Chips setzen, Zahl markieren und sehen, was dir zusteht."]],["♦","Baccara",["Bead Plate, Big Road und abgeleitete Tafeln.","Vorschläge mit klassischen Mustermethoden und mit Lucky 8, unserer eigenen Methode, samt Treffern.","Freies Protokoll und Plan-Simulator."]],["♣","Blackjack",["Der richtige Zug nach deinen Tischregeln und der Deckanzahl.","Deine Gewinnchance für jeden Zug.","Trainingsmodus: entscheide ohne Zahlen und sieh danach, ob du richtig lagst."]],["⚄","Craps",["Kompletter Tisch mit allen Wetten.","Saldo jedes Wurfs mit Auszahlungsdetails.","Wie gut jede Wette laut Hausvorteil ist."]],["⚂","Sic Bo",["Wahrscheinlichkeit und Auszahlung jeder Wette.","Vorschläge und Wurfverlauf.","Auszahlungen an deinen Tisch anpassbar."]]],"faqs":[["Garantiert Lucky 8, dass ich gewinne?","Nein. Es ist ein Lern- und Statistikwerkzeug. Keine Methode ändert den Hausvorteil."],["Kann man in der App um Geld spielen?","Nein. Lucky 8 verwendet kein echtes Geld: keine Einsätze, keine Annahme oder Auszahlung von Wetten und keine Verbindung zu einer Spielstätte. Pokerchips haben keinen Wert."],["Kann ich mit Freunden Poker spielen?","Ja, auf einem Handy: wähle unter Poker „Mit Freunden“, gebt eure Namen ein und reicht das Handy weiter. Bei jedem Zug wird der Bildschirm verdeckt."],["Funktioniert es offline?","Ja. Alles läuft auf dem Handy. Nur Werbung und Käufe brauchen Internet."],["Welche Daten werden gespeichert?","Deine Notizen, Partien und Einstellungen bleiben nur auf deinem Handy. Es gibt keine Benutzerkonten. Mehr in der Datenschutzerklärung."],["Wie kündige ich das Abo?","In Google Play: Profil → Zahlungen & Abos → Abos → Lucky 8 → Kündigen."],["In welchen Sprachen?","Spanisch, Englisch, Portugiesisch, Französisch, Deutsch, Italienisch, Russisch, Chinesisch, Japanisch, Koreanisch, Hindi und Indonesisch."]]},"it":{"name":"Italiano","nPoker":"Poker","nGames":"Giochi","nHow":"Come si usa","nPlans":"Versioni","nFaq":"Domande","nContact":"Contatti","badge":"♠ Novità: tornei fino a 100 giocatori →","h1":"Poker, roulette e altro, <span>sul tuo telefono</span>","lead":"Lucky 8 è uno strumento educativo: allenati a poker con un coach, gioca tornei fino a 100 giocatori o con i tuoi amici e calcola pagamenti e probabilità nei giochi da tavolo più popolari.","play":"Presto su Google Play","see":"Scopri cosa fa","soon":"Niente soldi veri · Solo maggiori di 18 anni · 12 lingue","pkT":"♠ Poker: cinque modi di giocare","pkS":"Tutto funziona offline e senza soldi veri. Le fiches non hanno alcun valore.","modes":[["🎯","Al tavolo","Per quando giochi a un tavolo vero: segna le tue carte e quelle del tavolo e vedi la probabilità di vincere, gli outs e se conviene chiamare."],["🎓","Modalità allenamento","Avversari con personalità (Nit, TAG, Calling station, LAG e Reg) e un coach che valuta ogni decisione e ti spiega perché. Suggerimento e glossario sempre a portata."],["🏆","Tornei","Da 1 a 100 avversari: più tavoli, bui che salgono, tavolo finale e podio. Alla fine il coach ti mostra dove hai sbagliato."],["🃏","Tavolo libero","Bui fissi e puntate libere, come a un tavolo vero. Gioca quante mani vuoi e alla fine vedi la tua analisi."],["👥","Con amici","Da 2 a 4 sullo stesso telefono, passandoselo. Lo schermo si copre a ogni turno perché nessuno veda le tue carte."]],"gT":"Sei giochi, un’unica app","gS":"Ogni gioco con i suoi strumenti.","sT":"Com’è","sS":"Tema scuro e chiaro, pensato per il telefono.","hT":"Come si usa","hS":"Non servono account né internet.","h1s":"Scegli il gioco nella schermata iniziale. Ognuno ha una breve guida.","h2s":"Segna quello che esce al tavolo o gioca contro gli avversari dell’app.","h3s":"Guarda statistiche, suggerimenti, quanto ti spetta o l’analisi del coach.","pT":"Gratis e versione completa","pS":"Inizia gratis e sblocca di più quando vuoi.","fT":"Gratis","fL":["I sei giochi con le funzioni di base.","Un torneo al giorno e gioco con 2 amici sullo stesso telefono.","In ogni gioco, fino a 3 video al giorno per usare tutte le funzioni per alcune giocate.","Un piccolo annuncio in basso."],"cT":"Versione completa","cL":["Tutte le funzioni dei sei giochi.","Tornei fino a 100 giocatori e gioco con fino a 4 amici.","Senza pubblicità.","Personalizzazione completa: ruote, tappeti, carte, dadi e colori."],"p1":"24 ore","p2":"settimana","p3":"mese","p4":"6 mesi","p5":"anno","pN":"Prezzi indicativi in dollari; Google Play li mostra nella valuta di ogni paese. Gli abbonamenti si rinnovano finché non li annulli su Google Play.","qT":"Domande frequenti","rT":"Gioco responsabile","rL":["Lucky 8 è educativo: non garantisce vincite. In questi giochi il banco ha sempre il vantaggio.","Decidi prima quanto puoi spendere e non cercare di recuperare le perdite.","Solo maggiori di 18 anni.","Se il gioco non è più un divertimento, parlane con una persona di fiducia o con un professionista. Puoi trovare supporto anche presso i <a href=\"https://www.gamblersanonymous.org\" target=\"_blank\" rel=\"noopener\">Giocatori Anonimi</a>."],"kT":"Contatti","kS":"Suggerimenti, dubbi o problemi: scrivici.","lab":"Scopri anche","foot":"Strumento educativo · Niente soldi veri · 18+","priv":"Informativa sulla privacy","terms":"Termini d’uso","games":[["♠","Poker",["Texas Hold’em e Omaha da 4 a 8 carte.","Probabilità di vincere contro 1 a 7 avversari, outs e se conviene chiamare.","Allenamento con coach, tornei fino a 100 giocatori, tavolo libero e gioco con amici."]],["◎","Roulette",["Europea e americana; segna sulla ruota o sul tappeto.","Suggerimenti con i vicini e statistiche complete.","Calcolatore dei pagamenti: metti le fiches, segna il numero e vedi quanto ti spetta."]],["♦","Baccarat",["Bead plate, Big Road e percorsi derivati.","Suggerimenti con i metodi classici di schemi e con Lucky 8, il nostro metodo, con i successi di ciascuno.","Registro libero e simulatore di piano."]],["♣","Blackjack",["La giocata secondo le regole del tuo tavolo e il numero di mazzi.","La tua probabilità di vincere per ogni giocata.","Modalità allenamento: decidi senza vedere i numeri e poi scopri se avevi ragione."]],["⚄","Craps",["Tavolo completo con tutte le puntate.","Saldo di ogni lancio con il dettaglio dei pagamenti.","Quanto è buona ogni puntata secondo il vantaggio del banco."]],["⚂","Sic Bo",["Probabilità e pagamento di ogni puntata.","Suggerimenti del tappeto e storico dei lanci.","Pagamenti regolabili per il tuo tavolo."]]],"faqs":[["Lucky 8 garantisce che vincerò?","No. È uno strumento educativo e statistico. Nessun metodo cambia il vantaggio del banco."],["Si può giocare o scommettere denaro nell’app?","No. Lucky 8 non gestisce denaro vero: non permette di scommettere, non riceve né paga puntate e non è collegata ad alcuna sala da gioco. Le fiches del poker non hanno valore."],["Posso giocare a poker con i miei amici?","Sì, sullo stesso telefono: in Poker scegli «Con amici», scrivete i nomi e passatevi il telefono. Lo schermo si copre a ogni turno."],["Funziona senza internet?","Sì. Tutto funziona sul telefono. Solo annunci e acquisti richiedono internet."],["Quali dati conserva?","Le tue annotazioni, partite e impostazioni restano solo sul tuo telefono. Non ci sono account. Più dettagli nell’informativa sulla privacy."],["Come annullo l’abbonamento?","Su Google Play: Profilo → Pagamenti e abbonamenti → Abbonamenti → Lucky 8 → Annulla."],["In quali lingue?","Spagnolo, inglese, portoghese, francese, tedesco, italiano, russo, cinese, giapponese, coreano, hindi e indonesiano."]]},"ru":{"name":"Русский","nPoker":"Покер","nGames":"Игры","nHow":"Как пользоваться","nPlans":"Версии","nFaq":"Вопросы","nContact":"Контакты","badge":"♠ Новое: турниры до 100 игроков →","h1":"Покер, рулетка и другое — <span>в вашем телефоне</span>","lead":"Lucky 8 — обучающий инструмент: тренируйте покер с тренером, играйте турниры до 100 игроков или с друзьями и считайте выплаты и вероятности в самых популярных настольных играх.","play":"Скоро в Google Play","see":"Что умеет","soon":"Без реальных денег · Только 18+ · 12 языков","pkT":"♠ Покер: пять способов играть","pkS":"Всё работает без интернета и без реальных денег. Фишки ничего не стоят.","modes":[["🎯","Игра за столом","Для настоящего стола: отметьте свои карты и борд и смотрите шанс на победу, ауты и стоит ли коллировать."],["🎓","Режим тренировки","Соперники с характером (Nit, TAG, Calling station, LAG и Reg) и тренер, который оценивает каждое решение и объясняет почему. Подсказка и глоссарий под рукой."],["🏆","Турниры","От 1 до 100 соперников: несколько столов, растущие блайнды, финальный стол и пьедестал. В конце тренер покажет ваши ошибки."],["🃏","Свободный стол","Фиксированные блайнды и свободные ставки, как за настоящим столом. Играйте сколько хотите, а в конце смотрите разбор."],["👥","С друзьями","От 2 до 4 игроков на одном телефоне, передавая его. В каждый ход экран закрывается, чтобы никто не видел ваши карты."]],"gT":"Шесть игр в одном приложении","gS":"У каждой игры свои инструменты.","sT":"Как это выглядит","sS":"Тёмная и светлая тема, сделано для телефона.","hT":"Как пользоваться","hS":"Не нужны ни аккаунт, ни интернет.","h1s":"Выберите игру на главном экране. У каждой есть короткое руководство.","h2s":"Записывайте, что выпадает за столом, или играйте против соперников приложения.","h3s":"Смотрите статистику, подсказки, сколько вам должны или разбор тренера.","pT":"Бесплатно и полная версия","pS":"Начните бесплатно и откройте больше, когда захотите.","fT":"Бесплатно","fL":["Все шесть игр с базовыми функциями.","Один турнир в день и игра с 2 друзьями на одном телефоне.","В каждой игре до 3 видео в день, чтобы пользоваться всеми функциями несколько раздач.","Небольшая реклама внизу."],"cT":"Полная версия","cL":["Все функции шести игр.","Турниры до 100 игроков и игра до 4 друзей.","Без рекламы.","Полная настройка: рулетки, столы, карты, кости и цвета."],"p1":"24 часа","p2":"неделя","p3":"месяц","p4":"6 месяцев","p5":"год","pN":"Ориентировочные цены в долларах; Google Play показывает их в валюте вашей страны. Подписки продлеваются автоматически, пока вы не отмените их в Google Play.","qT":"Частые вопросы","rT":"Ответственная игра","rL":["Lucky 8 — обучающий инструмент: выигрыш не гарантирован. В этих играх у заведения всегда есть преимущество.","Заранее решите, сколько можете потратить, и не пытайтесь отыграться.","Только для лиц старше 18 лет.","Если игра перестала приносить удовольствие, поговорите с близким человеком или специалистом. Поддержку можно найти и в сообществе <a href=\"https://www.gamblersanonymous.org\" target=\"_blank\" rel=\"noopener\">Анонимные игроки</a>."],"kT":"Контакты","kS":"Предложения, вопросы или проблемы — напишите нам.","lab":"Попробуйте также","foot":"Обучающий инструмент · Без реальных денег · 18+","priv":"Политика конфиденциальности","terms":"Условия использования","games":[["♠","Покер",["Техасский холдем и Омаха от 4 до 8 карт.","Шанс на победу против 1–7 соперников, ауты и стоит ли коллировать.","Тренировка с тренером, турниры до 100 игроков, свободный стол и игра с друзьями."]],["◎","Рулетка",["Европейская и американская; записывайте на колесе или поле.","Подсказки с соседями и полная статистика.","Калькулятор выплат: поставьте фишки, отметьте число и узнайте, сколько вам должны."]],["♦","Баккара",["Bead plate, Big Road и производные таблицы.","Подсказки по классическим методам и по Lucky 8, нашему методу, с попаданиями каждого.","Свободная запись и симулятор плана."]],["♣","Блэкджек",["Верный ход по правилам вашего стола и числу колод.","Ваш шанс на победу для каждого хода.","Режим тренировки: решайте, не видя цифр, а потом узнайте, были ли правы."]],["⚄","Крэпс",["Полный стол со всеми ставками.","Баланс каждого броска с подробной выплатой.","Насколько хороша каждая ставка с учётом преимущества заведения."]],["⚂","Сик-бо",["Вероятность и выплата каждой ставки.","Подсказки поля и история бросков.","Выплаты можно настроить под ваш стол."]]],"faqs":[["Гарантирует ли Lucky 8 выигрыш?","Нет. Это обучающий и статистический инструмент. Никакой метод не меняет преимущество заведения."],["Можно ли играть или ставить деньги в приложении?","Нет. Lucky 8 не работает с реальными деньгами: нельзя делать ставки, приложение не принимает и не выплачивает ставки и не связано ни с одним игровым заведением. Фишки в покере ничего не стоят."],["Можно играть в покер с друзьями?","Да, на одном телефоне: в разделе «Покер» выберите «С друзьями», введите имена и передавайте телефон. В каждый ход экран закрывается."],["Работает без интернета?","Да. Всё работает в телефоне. Интернет нужен только для рекламы и покупок."],["Какие данные хранятся?","Ваши записи, партии и настройки хранятся только в телефоне. Аккаунтов нет. Подробнее — в политике конфиденциальности."],["Как отменить подписку?","В Google Play: Профиль → Платежи и подписки → Подписки → Lucky 8 → Отменить."],["На каких языках?","Испанский, английский, португальский, французский, немецкий, итальянский, русский, китайский, японский, корейский, хинди и индонезийский."]]},"zh":{"name":"中文","nPoker":"扑克","nGames":"游戏","nHow":"使用方法","nPlans":"版本","nFaq":"常见问题","nContact":"联系","badge":"♠ 新功能：最多 100 人的锦标赛 →","h1":"扑克、轮盘等，<span>尽在手机中</span>","lead":"Lucky 8 是一款教育工具：跟着教练练习扑克，参加最多 100 人的锦标赛或和朋友一起玩，并在最受欢迎的桌面游戏中计算赔付和概率。","play":"即将登陆 Google Play","see":"看看能做什么","soon":"不涉及真钱 · 仅限 18 岁以上 · 12 种语言","pkT":"♠ 扑克：五种玩法","pkS":"全部离线可用，不涉及真钱。筹码没有任何价值。","modes":[["🎯","实桌辅助","在真实牌桌上使用：标出你的手牌和公共牌，查看胜率、补牌数以及是否值得跟注。"],["🎓","练习模式","对手各有个性（Nit、TAG、Calling station、LAG、Reg），教练为每个决定打分并说明原因。提示和术语表随时可用。"],["🏆","锦标赛","1 到 100 名对手：多张牌桌、盲注上涨、决赛桌和领奖台。结束后，教练告诉你哪里出了错。"],["🃏","自由牌桌","固定盲注、自由下注，就像真实牌桌。想打多少手都行，最后查看分析。"],["👥","和朋友","2 到 4 人轮流用同一部手机。每个回合屏幕都会遮住，没人能看到你的牌。"]],"gT":"六款游戏，一个应用","gS":"每款游戏都有专属工具。","sT":"界面预览","sS":"深色和浅色主题，专为手机设计。","hT":"使用方法","hS":"无需账号，无需联网。","h1s":"在首页选择游戏。每款都有简短指南。","h2s":"记录牌桌上的结果，或与应用中的对手对战。","h3s":"查看统计、建议、应得赔付或教练分析。","pT":"免费版与完整版","pS":"免费开始，随时解锁更多。","fT":"免费","fL":["六款游戏的基本功能。","每天一场锦标赛，可与 2 位朋友在同一部手机上玩。","每款游戏每天最多 3 个视频，可在几局内使用全部功能。","底部有小广告。"],"cT":"完整版","cL":["六款游戏的全部功能。","最多 100 人的锦标赛，最多 4 位朋友一起玩。","无广告。","完全自定义：轮盘、台面、纸牌、骰子和颜色。"],"p1":"24 小时","p2":"周","p3":"月","p4":"6 个月","p5":"年","pN":"参考价格以美元计；Google Play 会显示当地货币。订阅会自动续订，直到你在 Google Play 中取消。","qT":"常见问题","rT":"理性娱乐","rL":["Lucky 8 用于学习，不保证获利。在这些游戏中庄家始终占优。","事先决定能花多少，不要试图追回损失。","仅限 18 岁以上。","如果游戏不再是娱乐，请与信任的人或专业人士谈谈。也可以向 <a href=\"https://www.gamblersanonymous.org\" target=\"_blank\" rel=\"noopener\">匿名戒赌会</a> 寻求帮助。"],"kT":"联系","kS":"建议、疑问或问题：请写信给我们。","lab":"另请看看","foot":"教育工具 · 不涉及真钱 · 18+","priv":"隐私政策","terms":"使用条款","games":[["♠","扑克",["德州扑克和 4 到 8 张牌的奥马哈。","对 1 到 7 名对手的胜率、补牌数以及是否值得跟注。","教练练习、最多 100 人的锦标赛、自由牌桌和朋友对战。"]],["◎","轮盘",["欧式和美式；在轮盘或台面上记录。","带邻号的建议和完整统计。","赔付计算器：摆好筹码、标出号码，看看应得多少。"]],["♦","百家乐",["珠盘路、大路及衍生路。","经典路单方法和我们自有的 Lucky 8 方法给出的建议，以及各自命中次数。","自由记录和计划模拟。"]],["♣","二十一点",["按你的牌桌规则和牌副数给出打法。","每种打法的胜率。","练习模式：不看数字做决定，之后告诉你是否正确。"]],["⚄","花旗骰",["包含所有下注的完整牌桌。","每次掷骰的盈亏和赔付明细。","根据庄家优势评估每注好坏。"]],["⚂","骰宝",["每注的概率和赔付。","台面建议和掷骰记录。","赔付可按你的牌桌调整。"]]],"faqs":[["Lucky 8 能保证我赢吗？","不能。这是一款教育和统计工具。任何方法都无法改变庄家优势。"],["应用里能用钱下注吗？","不能。Lucky 8 不涉及真钱：不能下注，不收取也不支付赌注，也未与任何游戏场所连接。扑克筹码没有价值。"],["可以和朋友一起打扑克吗？","可以，用同一部手机：在扑克中选择「和朋友」，输入名字后轮流传手机。每个回合屏幕都会遮住。"],["可以离线使用吗？","可以。一切都在手机上运行。只有广告和购买需要联网。"],["会保存哪些数据？","你的记录、牌局和设置只保存在你的手机上。没有用户账号。详见隐私政策。"],["如何取消订阅？","在 Google Play：个人资料 → 付款和订阅 → 订阅 → Lucky 8 → 取消。"],["支持哪些语言？","西班牙语、英语、葡萄牙语、法语、德语、意大利语、俄语、中文、日语、韩语、印地语和印尼语。"]]},"ja":{"name":"日本語","nPoker":"ポーカー","nGames":"ゲーム","nHow":"使い方","nPlans":"バージョン","nFaq":"よくある質問","nContact":"お問い合わせ","badge":"♠ 新機能：最大100人のトーナメント →","h1":"ポーカー、ルーレットなどを<span>スマホで</span>","lead":"Lucky 8 は学習ツールです。コーチとポーカーを練習し、最大100人のトーナメントや友だちとの対戦を楽しみ、人気のテーブルゲームで配当や確率を計算できます。","play":"Google Play で近日公開","see":"機能を見る","soon":"実際のお金は使いません · 18歳以上限定 · 12言語","pkT":"♠ ポーカー：5つの遊び方","pkS":"すべてオフラインで、実際のお金は使いません。チッ 。"],["アプリでお金を賭けられますか？","いいえ。Lucky 8 は実際のお金を扱いません。賭けはできず、賭け金の受け取りや支払いもなく、どのゲーム施設ともつながっていません。ポーカーのチップに価値はありません。"],["友だちとポーカーはできますか？","はい、同じスマホで。ポーカーで「友だちと」を選び、名前を入力してスマホを回します。手番ごとに画面が隠れます。"],["オフラインで使えますか？","はい。すべてスマホ内で動作します。広告と購入だけネット接続が必要です。"],["どんなデータを保存しますか？","記録、対戦、設定はあなたのスマホにだけ保存されます。アカウントはありません。詳しくはプライバシーポリシーへ。"],["サブスクリプションの解約方法は？","Google Play で：プロフィール → お支払いと定期購入 → 定期購入 → Lucky 8 → 解約。"],["対応言語は？","スペイン語、英語、ポルトガル語、フランス語、ドイツ語、イタリア語、ロシア語、中国語、日本語、韓国語、ヒンディー語、インドネシア語。"]]},"ko":{"name":"한국어","nPoker":"포커","nGames":"게임","nHow":"사용 방법","nPlans":"버전","nFaq":"자주 묻는 질문","nContact":"문의","badge":"♠ 신규: 최대 100명 토너먼트 →","h1":"포커, 룰렛 그리고 더, <span>내 폰에서</span>","lead":"Lucky 8은 교육용 도구입니다. 코치와 포커를 연습하고, 최대 100명 토너먼트나 친구와의 게임을 즐기며, 인기 테이블 게임의 지급액과 확률을 계산하세요.","play":"Google Play 출시 예정","see":"기능 보기","soon":"실제 돈 없음 · 18세 이상 전용 · 12개 언어","pkT":"♠ 포커: 다섯 가지 플레이 방식","pkS":"모두 오프라인으로, 실제 돈 없이 작동합니다. 칩에는 아무 가치가 없습니다.","modes":[["🎯","테이블 보조","실제 테이블에서 사용: 내 카드와 보드를 표시하면 승률, 아웃츠, 콜할 가치가 있는지 알려 줍니다."],["🎓","연습 모드","개성 있는 상대(Nit, TAG, Calling station, LAG, Reg)와 모든 결정을 평가하고 이유를 알려 주는 코치. 힌트와 용어집도 바로 사용."],["🏆","토너먼트","1~100명의 상대: 여러 테이블, 오르는 블라인드, 파이널 테이블, 시상대. 끝나면 코치가 실수를 보여 줍니다."],["🃏","자유 테이블","고정 블라인드와 자유로운 베팅, 실제 테이블처럼. 원하는 만큼 치고 마지막에 분석을 확인하세요."],["👥","친구와","한 폰을 돌려 가며 2~4명이 플레이. 차례마다 화면이 가려져 아무도 내 카드를 못 봅니다."]],"gT":"여섯 가지 게임, 하나의 앱","gS":"게임마다 전용 도구.","sT":"화면 미리보기","sS":"다크/라이트 테마, 휴대폰에 맞춘 디자인.","hT":"사용 방법","hS":"계정도 인터넷도 필요 없습니다.","h1s":"홈에서 게임을 고르세요. 게임마다 짧은 안내가 있습니다.","h2s":"테이블에서 나온 결과를 기록하거나 앱의 상대와 플레이하세요.","h3s":"통계, 제안, 받아야 할 금액, 코치의 분석을 확인하세요.","pT":"무료 버전과 정식 버전","pS":"무료로 시작하고 원할 때 더 열어 보세요.","fT":"무료","fL":["여섯 게임의 기본 기능.","하루 한 번의 토너먼트와 한 폰으로 친구 2명과 플레이.","게임마다 하루 최대 3개의 영상으로 몇 판 동안 모든 기능 사용.","하단의 작은 광고."],"cT":"정식 버전","cL":["여섯 게임의 모든 기능.","최대 100명 토너먼트와 최대 4명의 친구와 플레이.","광고 없음.","룰렛, 레이아웃, 카드, 주사위, 색상 전체 맞춤 설정."],"p1":"24시간","p2":"주","p3":"월","p4":"6개월","p5":"년","pN":"참고 가격은 미국 달러 기준이며 Google Play에서는 각 나라 통화로 표시됩니다. 구독은 Google Play에서 해지할 때까지 자동 갱신됩니다.","qT":"자주 ayak call.","Latihan dengan pelatih, turnamen hingga 100 pemain, meja bebas, dan main bersama teman."]],["◎","Rolet",["Eropa dan Amerika; catat di roda atau meja.","Saran dengan angka tetangga dan statistik lengkap.","Kalkulator pembayaran: letakkan chip, tandai angka, dan lihat berapa yang harus dibayar."]],["♦","Bakarat",["Bead plate, Big Road, dan jalur turunan.","Saran dari metode pola klasik dan dari Lucky 8, metode kami sendiri, dengan jumlah tepatnya masing-masing.","Catatan bebas dan simulator rencana."]],["♣","Blackjack",["Langkah sesuai aturan mejamu dan jumlah dek.","Peluang menang untuk setiap langkah.","Mode latihan: putuskan tanpa melihat angka, lalu lihat apakah kamu benar."]],["⚄","Craps",["Meja lengkap dengan semua taruhan.","Saldo setiap lemparan dengan rincian pembayaran.","Seberapa bagus tiap taruhan menurut keunggulan bandar."]],["⚂","Sic Bo",["Peluang dan pembayaran setiap taruhan.","Saran meja dan riwayat lemparan.","Pembayaran bisa disesuaikan dengan mejamu."]]],"faqs":[["Apakah Lucky 8 menjamin saya menang?","Tidak. Ini alat edukasi dan statistik. Tidak ada metode yang mengubah keunggulan bandar."],["Bisakah bermain atau bertaruh uang di aplikasi?","Tidak. Lucky 8 tidak memakai uang sungguhan: tidak ada taruhan, tidak menerima atau membayar taruhan, dan tidak terhubung ke tempat permainan mana pun. Chip poker tidak bernilai."],["Bisakah main poker dengan teman?","Bisa, di satu ponsel: di Poker pilih «Bersama teman», tulis nama kalian, lalu edarkan ponsel. Layar tertutup setiap giliran."],["Bisa dipakai offline?","Ya. Semua berjalan di ponsel. Hanya iklan dan pembelian yang butuh internet."],["Data apa yang disimpan?","Catatan, permainan, dan pengaturanmu hanya tersimpan di ponselmu. Tidak ada akun pengguna. Detailnya di kebijakan privasi."],["Bagaimana membatalkan langganan?","Di Google Play: Profil → Pembayaran & langganan → Langganan → Lucky 8 → Batalkan."],["Tersedia dalam bahasa apa?","Spanyol, Inggris, Portugis, Prancis, Jerman, Italia,
